{% extends "main/header.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h3 class="fw-bold mb-4">Blocked Users</h3>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                {% for b in blocked %}
                    <div class="d-flex align-items-center justify-content-between p-3 {% if not forloop.last %}border-bottom{% endif %}">
                        <div class="d-flex align-items-center gap-2">
                            <div class="navbar-avatar" style="width:38px;height:38px;font-size:0.85rem;">{{ b.blocked.username|first|upper }}</div>
                            <span class="fw-semibold">{{ b.blocked.username }}</span>
                        </div>
                        <a href="{% url 'main:unblock_user' user_id=b.blocked.pk %}" class="btn btn-outline-secondary btn-sm rounded-pill">Unblock</a>
                    </div>
                {% empty %}
                    <div class="text-center text-muted py-5">You haven't blocked anyone.</div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
